name: Duxo Electron CI

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'resources/**'
      - '.github/workflows/electron.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'resources/**'
      - '.github/workflows/electron.yml'
  workflow_dispatch:

concurrency:
  group: electron-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui:
    name: Electron UI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: desktop
        run: npm run typecheck

      - name: Compile main process
        working-directory: desktop
        run: npm run compile

      - name: Compile renderer
        working-directory: desktop
        run: npm run compile:renderer

      - name: Build renderer assets
        working-directory: desktop
        run: node scripts/build.mjs

      - name: Prepare application icons
        working-directory: desktop
        run: npm run prepare-icons

      - name: Validate generated icon assets
        shell: bash
        run: |
          set -euo pipefail
          test -s desktop/build/icon.png
          test -s desktop/build/icon.ico
          echo "Generated PNG and ICO icon assets successfully."
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            test -s desktop/build/icon.icns
            echo "Generated ICNS icon asset successfully."
          fi
