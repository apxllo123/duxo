name: ▣ Duxo Release

on:
  push:
    branches: [main]
    paths:
      - 'Duxo Analyzer/**'
      - 'Duxo Adapter/**'
      - 'desktop/**'
      - 'resources/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to resume, e.g. v1.9 (leave empty for a new release)'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: release-duxo
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    name: Bump and publish Duxo release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.mode.outputs.tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Resolve release mode
        id: mode
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_TAG_INPUT" ]]; then
            release_tag="${RELEASE_TAG_INPUT#v}"
            if [[ "$release_tag" =~ ^([0-9]+)\.([0-9]+)(\.0)?$ ]]; then
              release_tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            else
              echo "Invalid release_tag '$RELEASE_TAG_INPUT'. Expected v1.9 or v1.9.0." >&2
              exit 1
            fi
            echo "mode=resume" >> "$GITHUB_OUTPUT"
            echo "version=${release_tag#v}.0" >> "$GITHUB_OUTPUT"
            echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest_tag="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)"
          current="$(node -p "require('./desktop/package.json').version")"
          if [[ -z "$latest_tag" ]]; then
            release_version="$current"
          else
            base="${latest_tag#v}"
            IFS='.' read -r major minor _patch <<< "$base"
            if [[ ! "$major" =~ ^[0-9]+$ || ! "$minor" =~ ^[0-9]+$ ]]; then
              echo "Latest tag '$latest_tag' is not a supported Duxo release version." >&2
              exit 1
            fi
            if [[ "$major" == "0" && "$minor" -ge 9 ]]; then
              release_version="1.0.0"
            elif (( minor >= 9 )); then
              release_version="$((major + 1)).0.0"
            else
              release_version="${major}.$((minor + 1)).0"
            fi
          fi
          release_tag="v${release_version%.*}"
          echo "mode=new" >> "$GITHUB_OUTPUT"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          if git rev-parse "$release_tag" >/dev/null 2>&1; then
            echo "Release tag already exists: $release_tag" >&2
            exit 1
          fi
      - name: Update application versions
        if: steps.mode.outputs.mode == 'new'
        env:
          RELEASE_VERSION: ${{ steps.mode.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const version = process.env.RELEASE_VERSION;
          const path = 'desktop/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.version = version;
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          path = Path('desktop/macos/Info.plist')
          with path.open('rb') as handle:
              plist = plistlib.load(handle)
          plist['CFBundleShortVersionString'] = os.environ['RELEASE_VERSION']
          plist['CFBundleVersion'] = os.environ['BUILD_NUMBER']
          with path.open('wb') as handle:
              plistlib.dump(plist, handle, fmt=plistlib.FMT_XML, sort_keys=False)
          PY
      - name: Verify version files
        if: steps.mode.outputs.mode == 'new'
        env:
          RELEASE_VERSION: ${{ steps.mode.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./desktop/package.json').version")" = "$RELEASE_VERSION"
          test "$(python3 - <<'PY'
          import plistlib
          with open('desktop/macos/Info.plist', 'rb') as handle:
              print(plistlib.load(handle)['CFBundleShortVersionString'])
          PY
          )" = "$RELEASE_VERSION"
      - name: Commit version bump
        if: steps.mode.outputs.mode == 'new'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- desktop/package.json desktop/macos/Info.plist; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/package.json desktop/macos/Info.plist
          git commit -m "chore: bump release version to ${{ steps.mode.outputs.tag }} [skip ci]"
          git push origin main
      - name: Create release tag
        env:
          RELEASE_TAG: ${{ steps.mode.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Using existing release tag $RELEASE_TAG"
          else
            git tag -a "$RELEASE_TAG" -m "Duxo $RELEASE_TAG" origin/main
            git push origin "$RELEASE_TAG"
          fi
      - name: Ensure GitHub release exists
        env:
          RELEASE_TAG: ${{ steps.mode.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Using existing GitHub release $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "Duxo $RELEASE_TAG" --generate-notes
          fi
  macos-build:
    name: Build  macOS release
    needs: release
    uses: ./.github/workflows/.yml
    with:
      ref: ${{ needs.release.outputs.release_tag }}
  publish-macos:
    name: Publish  macOS release assets
    needs: [release, macos-build]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
    steps:
      - name: Download macOS build artifact
        uses: actions/download-artifact@v4
        with:
          name: duxo-macos-arm64
          path: release-assets
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -type f -print
          for asset in \
            release-assets/Duxo-Native-macos-arm64.zip \
            release-assets/Duxo-Native-macos-arm64.zip.sha256 \
            release-assets/Duxo-Native-macos-arm64.dmg \
            release-assets/Duxo-Native-macos-arm64.dmg.sha256; do
            test -f "$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
          done
      - name: Attach macOS artifacts to GitHub release
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            release-assets/Duxo-Native-macos-arm64.zip \
            release-assets/Duxo-Native-macos-arm64.zip.sha256 \
            release-assets/Duxo-Native-macos-arm64.dmg \
            release-assets/Duxo-Native-macos-arm64.dmg.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
