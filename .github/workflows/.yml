name:  Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Duxo Analyzer/**'
      - 'Duxo Adapter/**'
      - 'desktop/**'
      - 'resources/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch or tag)'
        required: false
        default: main
        type: string
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build (branch or tag)'
        required: true
        type: string

concurrency:
  group: build-duxo-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name:  Build
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Verify checked-out source provenance
        shell: bash
        env:
          BUILD_REF: ${{ inputs.ref || github.ref }}
        run: |
          set -euo pipefail
          echo "== Build provenance =="
          echo "Requested ref: $BUILD_REF"
          checked_out_sha="$(git rev-parse HEAD)"
          resolved_sha="$(git rev-parse "$BUILD_REF^{commit}")"
          echo "Checked-out HEAD: $checked_out_sha"
          echo "Resolved ref: $resolved_sha"
          test "$checked_out_sha" = "$resolved_sha" || { echo "FAIL: checkout does not match requested ref." >&2; exit 1; }
          echo "== PE analyzer source at HEAD =="
          git show HEAD:"Duxo Analyzer/src/pe.rs" | grep -nE 'export\.ordinal|import\.ordinal' || true
          if git show HEAD:"Duxo Analyzer/src/pe.rs" | grep -q 'export\.ordinal'; then
            echo "FAIL: checked-out PE analyzer source contains unsupported export.ordinal" >&2
            exit 1
          fi
          if ! git show HEAD:"Duxo Analyzer/src/pe.rs" | grep -q 'import\.ordinal'; then
            echo "FAIL: checked-out PE analyzer source is missing import.ordinal handling" >&2
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Print build toolchain
        run: |
          set -euo pipefail
          rustc --version
          swift --version
          xcodebuild -version
          node --version
          npm --version
          xcode-select -p
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Build Analyzer
        run: cargo build --release -p duxo-analyzer
      - name: Build Adapter
        run: cargo build --release -p duxo-adapter
      - name: Stage native runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf desktop/resources/*
          install -m 755 target/release/duxo-analyzer desktop/resources/duxo-analyzer
          install -m 755 target/release/duxo-adapter desktop/resources/duxo-adapter
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Compile renderer
        working-directory: desktop
        run: npm run compile:renderer
      - name: Stage renderer assets
        working-directory: desktop
        run: node scripts/build.mjs
      - name: Typecheck native macOS source
        working-directory: desktop
        run: |
          set -euo pipefail
          swiftc \
            -typecheck \
            -target arm64-apple-macosx15.0 \
            -framework AppKit \
            -framework WebKit \
            -warnings-as-errors \
            macos/DuxoNative.swift
      - name: Build native macOS app
        working-directory: desktop
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: bash macos/build.sh
      - name: Validate native macOS artifacts
        shell: bash
        run: |
          set -u
          fail=0
          APP="desktop/dist-native/Duxo.app"
          ZIP="desktop/dist-native/Duxo-Native-macos-arm64.zip"
          ZIP_SHA="desktop/dist-native/Duxo-Native-macos-arm64.zip.sha256"
          DMG="desktop/dist-native/Duxo-Native-macos-arm64.dmg"
          DMG_SHA="desktop/dist-native/Duxo-Native-macos-arm64.dmg.sha256"
          check() {
            local label="$1"; shift
            if "$@"; then echo "PASS: $label"; else echo "FAIL: $label" >&2; fail=1; fi
          }
          check "app bundle exists" test -d "$APP"
          check "ZIP exists" test -f "$ZIP"
          check "ZIP checksum exists" test -f "$ZIP_SHA"
          check "DMG exists" test -f "$DMG"
          check "DMG checksum exists" test -f "$DMG_SHA"
          check "Info.plist is valid" /usr/bin/plutil -lint "$APP/Contents/Info.plist"
          MAIN="$APP/Contents/MacOS/Duxo"
          check "native executable exists" test -x "$MAIN"
          /usr/bin/file "$MAIN" || fail=1
          ANALYZER="$APP/Contents/Resources/duxo-runtime/duxo-analyzer"
          ADAPTER="$APP/Contents/Resources/duxo-runtime/duxo-adapter"
          check "Analyzer exists" test -x "$ANALYZER"
          check "Adapter exists" test -x "$ADAPTER"
          /usr/bin/file "$ANALYZER" || fail=1
          /usr/bin/file "$ADAPTER" || fail=1
          check "renderer index exists" test -f "$APP/Contents/Resources/ui/index.html"
          check "renderer JavaScript exists" test -f "$APP/Contents/Resources/ui/renderer.js"
          check "renderer stylesheet exists" test -f "$APP/Contents/Resources/ui/styles.css"
          MARKER="$APP/Contents/Resources/Duxo-Build.txt"
          check "build marker exists" test -f "$MARKER"
          check "native host marker" grep -Fq "Host: AppKit + WKWebView" "$MARKER"
          check "Electron absence marker" grep -Fq "Electron runtime: not used" "$MARKER"
          check "validation profile marker" grep -Fq "Validation profile: native-macos-v6" "$MARKER"
          check "Git SHA marker" grep -Fq "Git SHA: $GITHUB_SHA" "$MARKER"
          check "distribution marker" grep -Fq "Distribution: ZIP + DMG" "$MARKER"
          ICON="$APP/Contents/Resources/Duxo.icns"
          check "ICNS is non-empty" test -s "$ICON"
          check "Info.plist points to Duxo icon" /usr/bin/plutil -extract CFBundleIconFile raw "$APP/Contents/Info.plist"
          if find "$APP/Contents" -type f \( -name 'Electron Framework' -o -name 'electron' -o -name 'app.asar' \) -print -quit | grep -q .; then
            echo "FAIL: Electron runtime artifacts found in native app." >&2
            fail=1
          else
            echo "PASS: native app contains no Electron runtime artifacts"
          fi
          check "codesign verification" /usr/bin/codesign --verify --deep --strict "$APP"
          check "ZIP checksum" /usr/bin/shasum -a 256 -c "$ZIP_SHA"
          check "DMG checksum" /usr/bin/shasum -a 256 -c "$DMG_SHA"
          MOUNT_INFO="$(/usr/bin/hdiutil attach "$DMG" -nobrowse -noautoopen 2>"$RUNNER_TEMP/Duxo-dmg-attach.err")"
          MOUNT_PATH="$(printf '%s\n' "$MOUNT_INFO" | awk -F'\t' '/\/Volumes\// {print $NF; exit}')"
          if [[ -z "$MOUNT_PATH" ]]; then
            echo "FAIL: DMG could not be mounted" >&2
            cat "$RUNNER_TEMP/Duxo-dmg-attach.err" >&2 || true
            fail=1
          else
            trap '/usr/bin/hdiutil detach "$MOUNT_PATH" -quiet >/dev/null 2>&1 || true' EXIT
            check "DMG contains Duxo.app" test -d "$MOUNT_PATH/Duxo.app"
            check "DMG contains Applications link" test -d "$MOUNT_PATH/Applications"
            check "DMG native executable exists" test -x "$MOUNT_PATH/Duxo.app/Contents/MacOS/Duxo"
            check "DMG renderer exists" test -f "$MOUNT_PATH/Duxo.app/Contents/Resources/ui/renderer.js"
            check "DMG icon exists" test -f "$MOUNT_PATH/Duxo.app/Contents/Resources/Duxo.icns"
            check "DMG Analyzer exists" test -x "$MOUNT_PATH/Duxo.app/Contents/Resources/duxo-runtime/duxo-analyzer"
            check "DMG Adapter exists" test -x "$MOUNT_PATH/Duxo.app/Contents/Resources/duxo-runtime/duxo-adapter"
            check "DMG codesign verification" /usr/bin/codesign --verify --deep --strict "$MOUNT_PATH/Duxo.app"
            /usr/bin/hdiutil detach "$MOUNT_PATH" -quiet >/dev/null 2>&1 || fail=1
            trap - EXIT
          fi
          exit "$fail"
      - name: Test distributed native DMG through LaunchServices
        shell: bash
        run: |
          set -u
          DMG="desktop/dist-native/Duxo-Native-macos-arm64.dmg"
          LOG="$RUNNER_TEMP/Duxo-native-dmg-launch.log"
          MOUNT_INFO="$(/usr/bin/hdiutil attach "$DMG" -nobrowse -noautoopen 2>"$RUNNER_TEMP/Duxo-dmg-attach.err")"
          MOUNT_PATH="$(printf '%s\n' "$MOUNT_INFO" | awk -F'\t' '/\/Volumes\// {print $NF; exit}')"
          if [ -z "$MOUNT_PATH" ]; then
            cat "$RUNNER_TEMP/Duxo-dmg-attach.err" >&2 || true
            exit 1
          fi
          APP="$MOUNT_PATH/Duxo.app"
          /usr/bin/open "$APP" >"$LOG" 2>&1 || true
          READY=0
          for _ in $(seq 1 15); do
            if /usr/bin/pgrep -f -- "$APP/Contents/MacOS/Duxo$" >/dev/null 2>&1; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "FAIL: distributed DMG app did not stay running." >&2
            echo "--- LaunchServices output ---" >&2
            cat "$LOG" >&2 || true
            echo "--- Attach output ---" >&2
            cat "$RUNNER_TEMP/Duxo-dmg-attach.err" >&2 || true
            /usr/bin/hdiutil detach "$MOUNT_PATH" -quiet >/dev/null 2>&1 || true
            exit 1
          fi
          /usr/bin/pkill -f -- "$APP/Contents/MacOS/Duxo$" 2>/dev/null || true
          /usr/bin/hdiutil detach "$MOUNT_PATH" -quiet >/dev/null 2>&1 || true
      - name: Upload macOS native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: duxo-macos-arm64
          path: |
            desktop/dist-native/Duxo-Native-macos-arm64.zip
            desktop/dist-native/Duxo-Native-macos-arm64.zip.sha256
            desktop/dist-native/Duxo-Native-macos-arm64.dmg
            desktop/dist-native/Duxo-Native-macos-arm64.dmg.sha256
          if-no-files-found: error
